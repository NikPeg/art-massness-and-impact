<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1100" height="392" viewBox="0 0 1100 392" role="img" aria-labelledby="title desc"><title id="title">Частота: категории медиа, 2026</title><desc id="desc">GWI, II квартал 2026 · Интернет-пользователи 16+ в охваченных рынках · Россия исключена; Источник: GWI через DataReportal, Digital 2027, стр. 39. Исходные значения: data/media_use_2026.md. Музыка означает только стриминг. ТВ-стриминг включает не только сериалы. Пропуски не равны нулю. Частота означает среднее число дней в неделю, а не сеансов; пересекающиеся группы устройств нельзя складывать. Показаны только самостоятельные категории форматов; суммарный контакт со встроенными изображениями, музыкой, текстом и речью не измерен.; Короткие онлайн-видео: Короткие онлайн-видео, не только Instagram Reels; Длинные онлайн-видео: Прокси длинных онлайн-видео; категория источника; порог длительности и ориентация не выделены; Музыкальный стриминг: Только музыкальный стриминг; Видеоигры: Охват и время: все устройства; частота: сначала мобильные устройства, затем ПК и консоли; ТВ-стриминг (весь контент): Весь ТВ-стриминг, включая фильмы и другие программы; Полнометражные фильмы: Полнометражные фильмы не выделены; Цифровые книги: Нет сопоставимого наблюдения для категории; Отдельные изображения: Изображения не выделены из смешанного использования социальных сетей и платформ</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a34}</style><rect width="100%" height="100%" fill="white"/><text x="24.00" y="32.00" text-anchor="start" font-size="23" font-weight="500">Частота: категории медиа, 2026</text><line x1="290.00" y1="72.00" x2="290.00" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="290.00" y="366.00" text-anchor="middle" font-size="11" font-weight="400">0 дней/неделю</text><line x1="397.14" y1="72.00" x2="397.14" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="397.14" y="366.00" text-anchor="middle" font-size="11" font-weight="400">1 дней/неделю</text><line x1="504.29" y1="72.00" x2="504.29" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="504.29" y="366.00" text-anchor="middle" font-size="11" font-weight="400">2 дней/неделю</text><line x1="611.43" y1="72.00" x2="611.43" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="611.43" y="366.00" text-anchor="middle" font-size="11" font-weight="400">3 дней/неделю</text><line x1="718.57" y1="72.00" x2="718.57" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="718.57" y="366.00" text-anchor="middle" font-size="11" font-weight="400">4 дней/неделю</text><line x1="825.71" y1="72.00" x2="825.71" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="825.71" y="366.00" text-anchor="middle" font-size="11" font-weight="400">5 дней/неделю</text><line x1="932.86" y1="72.00" x2="932.86" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="932.86" y="366.00" text-anchor="middle" font-size="11" font-weight="400">6 дней/неделю</text><line x1="1040.00" y1="72.00" x2="1040.00" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="1040.00" y="366.00" text-anchor="middle" font-size="11" font-weight="400">7 дней/неделю</text><text x="24.00" y="94.00" text-anchor="start" font-size="13" font-weight="500">Короткие онлайн-видео</text><line x1="290.00" y1="90.00" x2="746.43" y2="90.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="746.4285714285713" cy="90" r="3.7" fill="#2463ad"><title>Короткие онлайн-видео</title></circle><text x="24.00" y="151.00" text-anchor="start" font-size="13" font-weight="500">Длинные онлайн-видео</text><line x1="290.00" y1="147.00" x2="650.00" y2="147.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="650.0" cy="147" r="3.7" fill="#a33c31"><title>Длинные онлайн-видео</title></circle><text x="24.00" y="208.00" text-anchor="start" font-size="13" font-weight="500">Музыкальный стриминг</text><line x1="290.00" y1="204.00" x2="622.14" y2="204.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="622.1428571428571" cy="204" r="3.7" fill="#b96216"><title>Музыкальный стриминг</title></circle><text x="24.00" y="265.00" text-anchor="start" font-size="13" font-weight="500">Видеоигры</text><line x1="290.00" y1="254.00" x2="590.00" y2="254.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="590.0" cy="254" r="3.7" fill="#3a824d"><title>Мобильные игры</title></circle><line x1="290.00" y1="273.00" x2="475.36" y2="273.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><path d="M475.3571428571429,268L480.3571428571429,273L475.3571428571429,278L470.3571428571429,273Z" fill="white" stroke="#3a824d" stroke-width="1.7"><title>Игры на ПК и консолях</title></path><text x="24.00" y="322.00" text-anchor="start" font-size="13" font-weight="500">ТВ-стриминг (весь контент)</text><line x1="290.00" y1="318.00" x2="586.79" y2="318.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="586.7857142857142" cy="318" r="3.7" fill="#7057a5"><title>ТВ-стриминг (весь контент)</title></circle></svg>
