<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Охват и время потребления</title><desc id="desc">Источник: GWI, II квартал 2026; DataReportal, Digital 2027, стр. 38, 40. Интернет-пользователи 16+ в охваченных рынках; Россия исключена. Данные: ../data/media_use_2026.md.
https://datareportal.com/reports/digital-2027-global-overview-report

Оси: недельный охват, % опрошенных, и минуты в неделю. Линии соединяют смещённые подписи с точными координатами. Музыка — только стриминг; ТВ-стриминг включает фильмы и другие программы. Короткие и длинные видео не выделяют ориентацию. Для отдельных фильмов, цифровых книг и изображений нет сопоставимых данных. Самоотчёты; аудитории пересекаются, пропуски не равны нулю. Различия не проверены на статистическую значимость.
