<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1100" height="392" viewBox="0 0 1100 392" role="img" aria-labelledby="title desc"><title id="title">Недельный охват: категории медиа, 2026</title><desc id="desc">Источник: GWI, II квартал 2026; DataReportal, Digital 2027, стр. 38. Интернет-пользователи 16+ в охваченных рынках; Россия исключена. Данные: ../data/media_use_2026.md.
https://datareportal.com/reports/digital-2027-global-overview-report

Охват: заявленное использование за неделю, % опрошенных. Музыка — только стриминг; ТВ-стриминг включает фильмы и другие программы. Короткие и длинные видео не выделяют ориентацию. Для отдельных фильмов, цифровых книг и изображений нет сопоставимых данных. Самоотчёты; аудитории пересекаются, пропуски не равны нулю.
