<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1100" height="392" viewBox="0 0 1100 392" role="img" aria-labelledby="title desc"><title id="title">Недельный охват: категории медиа, 2026</title><desc id="desc">GWI, II квартал 2026 · Интернет-пользователи 16+ в охваченных рынках · Россия исключена; Источник: GWI через DataReportal, Digital 2027, стр. 38. Исходные значения: data/media_use_2026.md. Музыка означает только стриминг. ТВ-стриминг включает не только сериалы. Пропуски не равны нулю. Охват означает заявленное использование за неделю среди опрошенных интернет-пользователей, а не долю всех людей. Показаны только самостоятельные категории форматов; суммарный контакт со встроенными изображениями, музыкой, текстом и речью не измерен.; Короткие онлайн-видео: Короткие онлайн-видео, не только Instagram Reels; Длинные онлайн-видео: Прокси длинных онлайн-видео; категория источника; порог длительности и ориентация не выделены; Музыкальный стриминг: Только музыкальный стриминг; Видеоигры: Охват и время: все устройства; частота: сначала мобильные устройства, затем ПК и консоли; ТВ-стриминг (весь контент): Весь ТВ-стриминг, включая фильмы и другие программы; Полнометражные фильмы: Полнометражные фильмы не выделены; Цифровые книги: Нет сопоставимого наблюдения для категории; Отдельные изображения: Изображения не выделены из смешанного использования социальных сетей и платформ</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a34}</style><rect width="100%" height="100%" fill="white"/><text x="24.00" y="32.00" text-anchor="start" font-size="23" font-weight="500">Недельный охват: категории медиа, 2026</text><line x1="290.00" y1="72.00" x2="290.00" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="290.00" y="366.00" text-anchor="middle" font-size="11" font-weight="400">0%</text><line x1="477.50" y1="72.00" x2="477.50" y2="342.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="477.50" y="366.00" text-anchor=