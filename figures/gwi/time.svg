<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="536" viewBox="0 0 1040 536" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Media consumption time</title><desc id="desc">GWI estimates for measured categories. Sources, legend and limitations are in the adjacent TXT.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247;font-variant-numeric:tabular-nums}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="43" text-anchor="start" font-size="27" font-weight="700">Media consumption time</text><text x="30" y="76" text-anchor="start" font-size="16" font-weight="400">Q2 2026 · Internet users 16+ · GWI</text><line x1="345.0" y1="108" x2="345.0" y2="466" stroke="#e3e8ee"/><text x="345.0" y="490" text-anchor="middle" font-size="13" font-weight="400">0</text><line x1="457.0" y1="108" x2="457.0" y2="466" stroke="#e3e8ee"/><text x="457.0" y="490" text-anchor="middle" font-size="13" font-weight="400">100</text><line x1="569.0" y1="108" x2="569.0" y2="466" stroke="#e3e8ee"/><text x="569.0" y="490" text-anchor="middle" font-size="13" font-weight="400">200</text><line x1="681.0" y1="108" x2="681.0" y2="466" stroke="#e3e8ee"/><text x="681.0" y="490" text-anchor="middle" font-size="13" font-weight="400">300</text><line x1="793.0" y1="108" x2="793.0" y2="466" stroke="#e3e8ee"/><text x="793.0" y="490" text-anchor="middle" font-size="13" font-weight="400">400</text><line x1="905.0" y1="108" x2="905.0" y2="466" stroke="#e3e8ee"/><text x="905.0" y="490" text-anchor="middle" font-size="13" font-weight="400">500</text><text x="30" y="151" text-anchor="start" font-size="17" font-weight="400">Video games</text><rect data-category="games" data-value="433.0" x="345" y="127" width="484.96" height="32" rx="3" fill="#8b9bad"/><text x="841.96" y="150" text-anchor="start" font-size="17" font-weight="600">7h 13m</text><text x="30" y="215" text-anchor="start" font-size="17" font-weight="700">Short videos</text><rect data-category="sh