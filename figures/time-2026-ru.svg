<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1040" height="463" viewBox="0 0 1040 463" role="img" aria-labelledby="title desc"><title id="title">Время в день: категории медиа, 2026</title><desc id="desc">Источник: GWI, II квартал 2026; DataReportal, Digital 2027, стр. 40. Интернет-пользователи 16+ в охваченных рынках; Россия исключена.
https://datareportal.com/reports/digital-2027-global-overview-report

Время: минуты в день, полученные делением недельного времени на 7. Музыка — только стриминг; ТВ-стриминг включает фильмы и другие программы. Короткие и длинные видео не выделяют ориентацию. Для отдельных фильмов, цифровых книг и изображений нет сопоставимых данных. Самоотчёты; аудитории пересекаются, пропуски не равны нулю. Синий: короткие видео; серый: остальные категории.
