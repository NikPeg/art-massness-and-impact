<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1100" height="392" viewBox="0 0 1100 392" role="img" aria-labelledby="title desc"><title id="title">Daily time: format proxies, 2026</title><desc id="desc">Source: GWI Q2 2026; DataReportal, Digital 2027, pp. 40. Internet users aged 16+ in covered markets; Russia excluded. Data: ../data/media_use_2026.md.
https://datareportal.com/reports/digital-2027-global-overview-report

Time: minutes per day, calculated as weekly time divided by seven. Music is streaming only; TV streaming includes films and other programmes. Short/long videos do not isolate orientation. Standalone films, digital books and pictures lack comparable data. Self-reports; audiences overlap and missing values are not zeros.
