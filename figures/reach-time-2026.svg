<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Reach and consumption time</title><desc id="desc">Source: GWI Q2 2026; DataReportal, Digital 2027, pp. 38, 40. Internet users aged 16+ in covered markets; Russia excluded. Data: ../data/media_use_2026.md.
https://datareportal.com/reports/digital-2027-global-overview-report

Axes: weekly reach, % of respondents, and minutes per week. Lines connect displaced labels to exact points. Music is streaming only; TV streaming includes films and other programmes. Short/long videos do not isolate orientation. Standalone films, digital books and pictures lack comparable data. Self-reports; audiences overlap and missing values are not zeros. Differences have not been tested for statistical significance.
