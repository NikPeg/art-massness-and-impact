<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="755" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">Weekly reach: format proxies, 2026</title><desc id="desc">GWI Q2 2026 · Internet users aged 16+ in covered markets · Russia excluded; Source: GWI via DataReportal, Digital 2027, p. 38. Source values: data/media_use_2026.md. Music means streaming only. TV streaming is not series-only. Missing rows are not zeros. Reach means reported weekly use within the surveyed online population, not a share of all people. Standalone format proxies only; embedded images, music, text and speech have no measured combined totals here.; Short online video: Short online video, not only Instagram Reels; Long online video: Long online video proxy; source-defined category; duration cutoff and orientation not isolated; Music streaming: Music streaming only; Video games: Reach/time all devices; frequency mobile, then PC/console; TV streaming (all content): All TV streaming, a proxy including films and other programs; Feature films: Feature films not isolated; Digital books: Not reported as a comparable category; Standalone pictures: Pictures not isolated from mixed social-media and platform use</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a34}</style><rect width="100%" height="100%" fill="white"/><text x="24.00" y="32.00" text-anchor="start" font-size="23" font-weight="500">Weekly reach: format proxies, 2026</text><text x="24.00" y="57.00" text-anchor="start" font-size="12" font-weight="400">GWI Q2 2026 · Internet users aged 16+ in covered markets · Russia excluded</text><text x="24.00" y="80.00" text-anchor="start" font-size="12" font-weight="400">Source-defined categories; overlapping audiences, not a complete ranking of media formats.</text><line x1="350.00" y1="111.00" x2="350.00" y2="552.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="350.00" y="576.00" text-anchor="middle" font-size="11" font-weight="400">0</text><line x1="516.25" y1="111.00" x2="516.25" y2="552.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="516.25" y="576.00" text-anchor="middle" font-size="11" font-weight="400">25</text><line x1="682.50" y1="111.00" x2="682.50" y2="552.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="682.50" y="576.00" text-anchor="middle" font-size="11" font-weight="400">50</text><line x1="848.75" y1="111.00" x2="848.75" y2="552.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="848.75" y="576.00" text-anchor="middle" font-size="11" font-weight="400">75</text><line x1="1015.00" y1="111.00" x2="1015.00" y2="552.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="1015.00" y="576.00" text-anchor="middle" font-size="11" font-weight="400">100</text><text x="350.00" y="600.00" text-anchor="start" font-size="12" font-weight="400">Percent of surveyed online adults</text><text x="24.00" y="128.00" text-anchor="start" font-size="13" font-weight="500">Short online video</text><text x="24.00" y="146.00" text-anchor="start" font-size="10" font-weight="400">Source category; not Instagram Reels alone</text><line x1="350.00" y1="129.00" x2="938.52" y2="129.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="938.525" cy="129" r="3.7" fill="#2463ad"><title>Short online video</title></circle><text x="949.52" y="133.00" text-anchor="start" font-size="12" font-weight="400">88.5%</text><text x="24.00" y="185.00" text-anchor="start" font-size="13" font-weight="500">Long online video</text><text x="24.00" y="203.00" text-anchor="start" font-size="10" font-weight="400">Source category; duration/orientation not isolated</text><line x1="350.00" y1="186.00" x2="889.98" y2="186.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="889.98" cy="186" r="3.7" fill="#a33c31"><title>Long online video</title></circle><text x="900.98" y="190.00" text-anchor="start" font-size="12" font-weight="400">81.2%</text><text x="24.00" y="242.00" text-anchor="start" font-size="13" font-weight="500">Music streaming</text><text x="24.00" y="260.00" text-anchor="start" font-size="10" font-weight="400">Streaming listening only; no embedded-music union</text><line x1="350.00" y1="243.00" x2="864.71" y2="243.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="864.71" cy="243" r="3.7" fill="#b96216"><title>Music streaming</title></circle><text x="875.71" y="247.00" text-anchor="start" font-size="12" font-weight="400">77.4%</text><text x="24.00" y="299.00" text-anchor="start" font-size="13" font-weight="500">Video games</text><text x="24.00" y="317.00" text-anchor="start" font-size="10" font-weight="400">Reach/time: all devices; frequency: device groups</text><line x1="350.00" y1="300.00" x2="844.76" y2="300.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="844.76" cy="300" r="3.7" fill="#3a824d"><title>Video games</title></circle><text x="855.76" y="304.00" text-anchor="start" font-size="12" font-weight="400">74.4%</text><text x="24.00" y="356.00" text-anchor="start" font-size="13" font-weight="500">TV streaming (all content)</text><text x="24.00" y="374.00" text-anchor="start" font-size="10" font-weight="400">Series proxy; includes films and other programmes</text><line x1="350.00" y1="357.00" x2="828.80" y2="357.00" stroke="#cbd3dc" stroke-width="1" stroke-dasharray=""/><circle cx="828.8" cy="357" r="3.7" fill="#7057a5"><title>TV streaming (all content)</title></circle><text x="839.80" y="361.00" text-anchor="start" font-size="12" font-weight="400">72%</text><text x="24.00" y="413.00" text-anchor="start" font-size="13" font-weight="500">Feature films</text><text x="24.00" y="431.00" text-anchor="start" font-size="10" font-weight="400">No film-only observation</text><text x="362.00" y="419.00" text-anchor="start" font-size="12" font-weight="400">Not available — no comparable observation</text><text x="24.00" y="470.00" text-anchor="start" font-size="13" font-weight="500">Digital books</text><text x="24.00" y="488.00" text-anchor="start" font-size="10" font-weight="400">No comparable reading observation</text><text x="362.00" y="476.00" text-anchor="start" font-size="12" font-weight="400">Not available — no comparable observation</text><text x="24.00" y="527.00" text-anchor="start" font-size="13" font-weight="500">Standalone pictures</text><text x="24.00" y="545.00" text-anchor="start" font-size="10" font-weight="400">Not isolated from mixed platform use</text><text x="362.00" y="533.00" text-anchor="start" font-size="12" font-weight="400">Not available — no comparable observation</text><line x1="24.00" y1="640.00" x2="1076.00" y2="640.00" stroke="#d3d9df" stroke-width="1" stroke-dasharray=""/><text x="24.00" y="663.00" text-anchor="start" font-size="11" font-weight="400">Source: GWI via DataReportal, Digital 2027, p. 38. Source values: data/media_use_2026.md.</text><text x="24.00" y="682.00" text-anchor="start" font-size="11" font-weight="400">Music means streaming only. TV streaming is not series-only. Missing rows are not zeros.</text><text x="24.00" y="701.00" text-anchor="start" font-size="11" font-weight="400">Reach means reported weekly use within the surveyed online population, not a share of all people.</text><text x="24.00" y="720.00" text-anchor="start" font-size="11" font-weight="400">Standalone format proxies only; embedded images, music, text and speech have no measured combined totals here.</text></svg>
